name: baixar-fotos
# Baixa para fotos/ as imagens listadas em fotos/_baixar.txt (uma por linha: URL nome-do-arquivo)
on:
  push:
    paths: ["fotos/_baixar.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read -r url nome; do
            [ -z "$url" ] && continue
            curl -fsSL -A "Mozilla/5.0" -o "fotos/$nome" "$url" && echo "ok $nome"
          done < fotos/_baixar.txt
          : > fotos/_baixar.txt
          git config user.name folhadebel-cards; git config user.email folhadebel-cards@users.noreply.github.com
          git add fotos && git commit -m "fotos baixadas" && git push || echo "nada novo"
